metadata:
  name: node-agent
  namespace: assessment-10
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      nodeSelector:
        assessment.example.com/eligible: 'true'
      containers:
      - name: agent
        image: nginx:1.27
---
apiVersion: v1
kind: Namespace
metadata:
  name: assessment-11
  labels:
    app.kubernetes.io/part-of: kubectl-assessment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: assessment-11
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.27
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: assessment.example.com/zone
                operator: In
                values:
                - nonexistent-zone
