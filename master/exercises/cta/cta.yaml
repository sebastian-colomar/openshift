apiVersion: v1
kind: Namespace
metadata:
  name: assessment-06
  labels:
    app.kubernetes.io/part-of: kubectl-assessment
---
apiVersion: v1
kind: Secret
metadata:
  name: app-credentials
  namespace: assessment-06
type: Opaque
stringData:
  username: student
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: assessment-06
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.27
        env:
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-credentials
              key: password
